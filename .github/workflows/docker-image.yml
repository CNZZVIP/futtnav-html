name: Docker Image

# 源码变更时自动构建并推送多架构镜像：
#   - ghcr.io/cnzzvip/futtnav:latest（GitHub Container Registry，免额外凭据）
#   - Docker Hub <DOCKER_HUB_USERNAME>/futtnav:latest（配置仓库 Secrets 后自动启用）
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'public/**'
      - 'scripts/build.mjs'
      - 'packaging/docker/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKER_HUB_TOKEN != '' }}
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cnzzvip/futtnav:latest
            ghcr.io/cnzzvip/futtnav:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME != '' && format('{0}/futtnav:latest', secrets.DOCKER_HUB_USERNAME) || 'ghcr.io/cnzzvip/futtnav:latest' }}
